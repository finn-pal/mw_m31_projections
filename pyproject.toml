[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mw-m31-projections"
version = "0.1.0"
description = "Milky Way–M31 projection and observation utilities"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

# -------------------------
# Ruff configuration
# -------------------------

[tool.ruff]
exclude = [".venv"]
extend-include = ["*.ipynb"]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "Q", "I"]
extend-select = ["E501"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"